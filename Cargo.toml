[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/STARSCrazy/decovery"
rust-version = "1.89"

[workspace.dependencies]
decovery-core = { path = "crates/decovery-core" }
decovery-diff = { path = "crates/decovery-diff" }
decovery-facade = { path = "crates/decovery-facade" }
decovery-loaders = { path = "crates/decovery-loaders" }
decovery-mcp = { path = "crates/decovery-mcp" }
decovery-objects = { path = "crates/decovery-objects" }
decovery-plugin = { path = "crates/decovery-plugin" }
decovery-x86 = { path = "crates/decovery-x86" }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
blake3 = "1"
sha2 = "0.11"
tempfile = "3"
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
