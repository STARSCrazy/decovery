schema = 1
id = "watcom-10.6"
family = "watcom"
language = "c"
version = "10.6"
bits = 32
object_format = "omf"
object_extension = "OBJ"
runners = ["dosbox-lab"]
command = "WCC386 -zq {flags} {input}"
prelude = ['SET WATCOM=D:\', 'SET INCLUDE=D:\H', 'SET PATH=D:\BINW']
prologue = []
padding = false
fingerprint = ["BINW/WCC386.EXE"]

[decoration]
function = "{name}_"
data = "_{name}"

[linker]
command = "WLINK @{response}"
library_dir = 'D:\LIB386'
output = "{name}.EXE"

[assembler]
command = "WASM -zq -fo={output} {input}"
