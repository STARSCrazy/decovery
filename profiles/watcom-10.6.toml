schema = 1
id = "watcom-10.6"
family = "watcom"
language = "c"
version = "10.6"
bits = 32
object_format = "omf"
object_extension = "OBJ"
runners = ["dosbox-lab"]
command = "WCC386 -zq {flags} {input}"
prelude = ['SET WATCOM=D:\', 'SET INCLUDE=D:\H', 'SET PATH=D:\BINW']
prologue = []
padding = false
fingerprint = ["BINW/WCC386.EXE"]

# string literals go to CONST (other constant data to CONST2), each at a multiple of 4 behind uninitialised fill
[literals]
sections = ["CONST"]
align = 4

[decoration]
function = "{name}_"
data = "_{name}"

[linker]
command = "WLINK @{response}"
library_dir = 'D:\LIB386'
output = "{name}.EXE"
# WLINK 10.6 marks the LE objects preload only for a system of its WLSYSTEM.LNK, not for the spelled-out format
le_system = "dos4g"

[assembler]
command = "WASM -zq -fo={output} {input}"
