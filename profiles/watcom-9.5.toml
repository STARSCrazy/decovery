schema = 1
id = "watcom-9.5"
family = "watcom"
language = "c"
version = "9.5"
bits = 32
object_format = "omf"
object_extension = "OBJ"
runners = ["unicorn-dos", "dosbox-lab"]
command = "WCC386 -zq {flags} {input}"
prelude = ['SET WATCOM=D:\', 'SET INCLUDE=D:\H', 'SET PATH=D:\BINW']
prologue = []
padding = false
fingerprint = ["BINW/WCC386.EXE"]

# string literals go to CONST (other constant data to CONST2), each at a multiple of 4 behind uninitialised fill
[literals]
sections = ["CONST"]
align = 4

[decoration]
function = "{name}_"
data = "_{name}"

[linker]
command = "WLINK @{response}"
library_dir = 'D:\LIB386'
output = "{name}.EXE"
# WLINK 9.5 refuses `option start` for DOS/4G: the entry point goes into the module end record
start_option = false

[assembler]
profile = "watcom-10.6"
