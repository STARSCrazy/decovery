# Aztec C86 4.2b (1989; the compiler reports itself as 4.10d): small model, own object format, functions and data decorated with a trailing underscore
schema = 1
id = "aztec-c86-4.2b"
family = "aztec-c86"
language = "c"
version = "4.2b"
bits = 16
object_format = "aztec"
object_extension = "O"
# unicorn-dos first (faster); CC loads each pass in place over its own code, which unicorn-dos runs since it drops
# stale translated code on DOS writes
runners = ["unicorn-dos", "dosbox-lab"]
# CC runs the passes and the assembler itself (command form as in Decomp)
command = "CC -n {flags} {input}"
prelude = ['SET CLIB=D:\LIB\', 'SET INCLUDE=D:\INCLUDE\', 'SET PATH=D:\BIN']
# CC puts its work files (ctmp1..4, named after the time of day) where CCTEMP points, not into TMP: jobs started in
# the same second would otherwise share them
job_prelude = ['SET CCTEMP=C:\{tmp}\']
# the frame differs with and without +b: no fixed prologue
prologue = []
# with +b the frame goes through the runtime helper: mov ax,-frame; call $csav
prologue_pattern = "B8 ?? ?? E8 ?? ??"
prologue_call = "$csav"
padding = false
# identifiers are cut to 31 characters without a warning
name_length = 31
fingerprint = ["BIN/CC.EXE"]

[decoration]
function = "{name}_"
data = "{name}_"

# option search: one choice from each set
[search]
flag_sets = [["", "+b"], ["+h", "-z"]]

# AS (Aztec 8086 Assembler 4.10d) writes X.O next to X.ASM in CC's object format; it takes no switches here (CC's
# -I only finds lmacros.h). Errors read `ERROR:X.ASM:<line>: <text>`, exit code 4 without input.
[assembler]
command = "AS {input}"

# LN (Aztec C86 linker 4.10d), used by `build` with `[link]` (ADR 0018): one run for the root program (with `-r` it
# writes <root>.RSM), then one run per overlay against that symbol file. Libraries go as `-l<name>` (CLIB points
# to D:\LIB\); a line longer than the DOS command line lists the objects in a control file read with `-f`.
[linker]
command = "LN {flags} -o {output} {objects} {libraries}"
library_dir = 'D:\LIB'
output = "{name}"
library_flag = "-l{name}"
control_file = "-f {file}"
line_limit = 126
