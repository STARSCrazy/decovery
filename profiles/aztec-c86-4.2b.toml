# Aztec C86 4.2b (1989; the compiler reports itself as 4.10d): small model, own object format, functions and data decorated with a trailing underscore
schema = 1
id = "aztec-c86-4.2b"
family = "aztec-c86"
language = "c"
version = "4.2b"
bits = 16
object_format = "aztec"
object_extension = "O"
runners = ["unicorn-dos", "dosbox-lab"]
# CC runs the passes and the assembler itself (command form as in Decomp)
command = "CC -n {flags} {input}"
prelude = ['SET CLIB=D:\LIB\', 'SET INCLUDE=D:\INCLUDE\', 'SET PATH=D:\BIN']
# the frame differs with and without +b: no fixed prologue
prologue = []
padding = false
fingerprint = ["BIN/CC.EXE"]

[decoration]
function = "{name}_"
data = "{name}_"

# option search: one choice from each set
[search]
flag_sets = [["", "+b"], ["+h", "-z"]]
