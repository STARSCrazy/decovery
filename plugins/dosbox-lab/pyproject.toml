[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decovery-dosbox-lab"
version = "0.1.0"
description = "decovery plugin: runs original DOS compilers in dosbox-lab (runner capability)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0 OR MIT"
dependencies = ["decovery-plugin"]

[tool.setuptools]
packages = ["decovery_dosbox_lab"]
